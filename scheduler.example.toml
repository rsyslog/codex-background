# Example codex-bg configuration.
#
# Copy this to scheduler.toml and adjust it for your own test repository.
# Keep real scheduler.toml files private if they contain private repository
# names, labels, paths, or operational policy.

database_path = "./codex-bg.sqlite3"
workdir_root = "./workdirs"
workspace_root = "~/aibot"
poll_interval_seconds = 900
workspace_refresh_interval_seconds = 900
debug = false
dry_run = true

[codex]
sandbox = "read-only"
approval_policy = "on-request"
# Main task model. Omit to use the local Codex CLI default.
# model = "gpt-5.4"
# reasoning_effort = "medium"

[prescreen]
# Omit this section or leave module unset to accept all plugin pre-screening
# requests. The Codex implementation skips automation when it cannot produce a
# clear go/no-go decision.
module = "codex_bg.prescreen_codex"
# If model or reasoning_effort are omitted here, the pre-screener inherits
# [codex] values. If neither section sets them, it uses gpt-5.4-mini/medium.
# model = "gpt-5.4-mini"
# reasoning_effort = "medium"
# For custom pre-screeners without create_prescreener(), use:
# class_name = "Plugin"

[[workspaces]]
key = "example-repo"
repo = "https://github.com/example/example-repo.git"
branch = "main"

[[plugins]]
name = "issue_triage"
module = "codex_bg.plugins.github_issue_triage"
interval_seconds = 900
# The issue triage plugin defaults to 15 accepted events/hour and 30/day.
# Set these explicitly to override the plugin defaults. Omit them for defaults.
# rate_limit_per_hour = 15
# rate_limit_per_day = 30

[[plugins.repos]]
repo = "example/example-repo"
workspace_key = "example-repo"
instructions_file = "./triage-instructions.example.md"
triaged_label = "AI Triaged"
allowed_labels = ["bug", "documentation", "enhancement", "question"]
allowed_milestones = []
limit = 30
max_issue_age_days = 7
sandbox = "read-only"
# Optional repository-specific addition to the default pre-screening policy.
# prescreen_policy = "Only automate issues about this repository's supported components."
