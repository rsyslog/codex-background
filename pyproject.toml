[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bg"
version = "0.1.0"
description = "Plugin-driven Codex task scheduler"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
codex-bg = "codex_bg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    # codex-bg intentionally invokes trusted local CLIs (`gh`, `git`, `codex`)
    # via argument lists with shell=False. Keep this documented so Bandit still
    # checks the rest of the codebase without flagging every subprocess call.
    "B603",
]
